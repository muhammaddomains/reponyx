# Dependabot configuration for DesktopDashboards.
# Keeps npm/pnpm dependencies, Cargo dependencies and GitHub Actions
# up to date with weekly PRs.
# Major version bumps are NOT grouped: they arrive as their own PRs
# so breaking changes can be reviewed separately.
#
# NOTE: the `dependencies` and `workflows` labels must exist in the repo
# (Settings -> Labels); Dependabot skips labels that do not exist.
