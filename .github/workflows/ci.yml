name: CI

# CI checks for every push to main and every pull request.
# What runs here:
# - `pnpm install --frozen-lockfile` validates that pnpm-lock.yaml is
#   in sync with package.json.
# - `cargo test` runs the Rust unit tests in src-tauri/src/
#   (CLI parsing, config, widget placement).
# What intentionally does NOT run here:
# - There is no JavaScript unit test suite in this repo (no Vitest,
#   no tests/ directory; the frontend is a single static src/index.html),
#   so there is no `pnpm run test:unit` step.
# - `tauri build` bundles the NSIS installer only
#   (bundle targets: ["nsis"] in src-tauri/tauri.conf.json), which
#   cannot be built on Linux.
# `cargo test` compiles the Tauri crates, which link system libraries
# (glib-2.0 and friends), so the Linux system dependencies below are
# installed first — without them the build fails with
# "Package glib-2.0 was not found".
