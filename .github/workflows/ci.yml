name: CI

# CI checks for every push to main, every pull request, and every
# release tag (`v*`) — a tag must run the same tests as a push, so
# an untested commit can never be released (audit E2).
#
# Jobs:
# - `rust` (Linux): fmt, clippy (0 warnings enforced), and the full
#   Rust test suite for every workspace crate EXCEPT the desktop
#   crate — `reponyx-desktop` needs WebViewGTK / gdk-3.0, which
#   Linux runners do not have (same limitation as a local Linux VM).
# - `frontend` (Linux): pnpm install (frozen lockfile), typecheck,
#   frontend unit tests (Vitest), desktop vite build, eslint.
# - `windows-build` (Windows): the desktop Rust compile check —
#   `cargo check -p reponyx-desktop` — plus the vite build. This is
#   the first real compile of the desktop Tauri wiring (agent.rs,
#   tray.rs, repositories.rs, synchronization.rs). The agent and
#   broker release binaries are built first because the desktop's
#   bundle.resources reference them and tauri-build validates those
#   paths even during `cargo check`.
# - `windows-installer` (Windows): the full installer build
#   (`tauri build`) plus the portable ZIP, uploaded as artifacts —
#   the packaging itself is a checkable thing, and a broken
#   installer must fail CI, not the first release (audit Phase 4).
#   It signs with a throwaway key generated in the job (the real
#   key must never reach CI); that proves packaging and updater
#   artifact generation, not the update flow — the throwaway key
#   does not match the public key baked into the app, so a client
#   would refuse that signature. The real flow is proven by
#   `docs/qa/updater-e2e.md` on a Windows machine.
#
# What intentionally does NOT run here:
# - Nothing is published from CI — the Release workflow owns that.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (0 warnings)
        run: cargo clippy --workspace --exclude reponyx-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude reponyx-desktop

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input: package.json pins pnpm via
      # `packageManager` (pnpm@12.21.0) and pnpm/action-setup reads it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Frontend tests
        run: pnpm --filter @reponyx/desktop test

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      - name: Lint
        run: pnpm -r lint

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      # WebView2 is preinstalled on GitHub-hosted Windows runners, so
      # the desktop crate compiles here. This is the check that
      # catches desktop Rust errors before they reach a user's machine.
      # The agent and broker release binaries must exist first: the
      # desktop's bundle.resources reference them (tauri.conf.json)
      # and tauri-build validates those paths even during `cargo
      # check`. The Release workflow builds them before tauri-action
      # for the same reason.
      - name: Build agent and broker (release)
        run: cargo build --release -p reponyx-background-agent -p reponyx-auth-broker

      - name: Check desktop crate
        run: cargo check -p reponyx-desktop

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      # The installer bundles the agent and the broker
      # (bundle.resources in apps/desktop/src-tauri/tauri.conf.json),
      # so they must be built in release mode first — same as
      # windows-build.
      - name: Build agent and broker (release)
        run: cargo build --release -p reponyx-background-agent -p reponyx-auth-broker

      # The updater artifacts (latest.json) need a signing key. CI
      # has no access to the real one and must never see it, so this
      # job generates a throwaway keypair and signs with it. That
      # proves the installer, the portable ZIP, and the updater
      # artifact generation end to end; it does NOT prove the update
      # flow — the throwaway key does not match the public key baked
      # into the app. The real flow is proven by
      # docs/qa/updater-e2e.md on a Windows machine with the real
      # key. The key file lives only on this runner and is discarded
      # with it.
      - name: Generate throwaway signing key
        working-directory: apps/desktop
        run: pnpm tauri signer generate --ci -p "ci" -w ci-signing.key --force

      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -Raw ci-signing.key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = "ci"
          pnpm tauri build

      # The portable ZIP is not produced by the Tauri build, so it is
      # built here, mirroring the Release workflow: the built exe
      # plus the agent, the broker, and the README in one folder.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/reponyx-desktop.exe portable/
          Copy-Item target/release/reponyx-agent.exe portable/
          Copy-Item target/release/reponyx-auth-broker.exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath reponyx-desktop-x64.zip

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            reponyx-desktop-x64.zip
          if-no-files-found: error
