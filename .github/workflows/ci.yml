name: CI

# CI checks for every push to main and every pull request.
#
# Jobs:
# - `rust` (Linux): fmt, clippy (0 warnings enforced), and the full
#   Rust test suite for every workspace crate EXCEPT the desktop
#   crate — `reponyx-desktop` needs WebViewGTK / gdk-3.0, which
#   Linux runners do not have (same limitation as a local Linux VM).
# - `frontend` (Linux): pnpm install (frozen lockfile), typecheck,
#   desktop vite build, eslint.
# - `windows-build` (Windows): the desktop Rust compile check —
#   `cargo check -p reponyx-desktop` — plus the vite build. This is
#   the first real compile of the desktop Tauri wiring (agent.rs,
#   tray.rs, repositories.rs, synchronization.rs); the full installer
#   build happens in the Release workflow, not here.
#
# What intentionally does NOT run here:
# - There is no JavaScript unit test suite in this repo (no Vitest,
#   no Playwright), so there is no `pnpm run test:unit` step.
# - `cargo tauri build` (installer packaging) is release-only.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (0 warnings)
        run: cargo clippy --workspace --exclude reponyx-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude reponyx-desktop

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input: package.json pins pnpm via
      # `packageManager` (pnpm@12.21.0) and pnpm/action-setup reads it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      - name: Lint
        run: pnpm -r lint

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      # WebView2 is preinstalled on GitHub-hosted Windows runners, so
      # the desktop crate compiles here. This is the check that
      # catches desktop Rust errors before they reach a user's machine.
      - name: Check desktop crate
        run: cargo check -p reponyx-desktop
