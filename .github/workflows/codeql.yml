name: CodeQL

# CodeQL code scanning for RepoNyx.
# Analyzes the TypeScript / JavaScript frontend and desktop code
# (apps/desktop/src, packages/*). Rust is NOT scanned by CodeQL —
# the Rust analysis is covered by `cargo clippy` (0 warnings) and
# `cargo test` in the CI workflow. Runs on pushes and pull requests
# to main, plus a weekly run.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # No build step: the JavaScript database is built directly
          # from source, so no cargo build (and no Tauri system
          # dependencies) is needed on the runner.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
