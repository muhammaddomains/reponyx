name: Lint

# Repo checks that are not the compiler or the test suite: Markdown
# hygiene, workflow YAML validity, and the private-key scan
# (scripts/check-no-private-key.sh — the GitHub App private key must
# never appear in the desktop app).
#
# What is intentionally NOT here:
# - No frontmatter / link / docs-status checks: RepoNyx has no such
#   scripts (no check:frontmatter, check:links or check:status), so
#   there is nothing to run. Do not add a step that calls a script
#   that does not exist.
# - Frontend lint (eslint) and TypeScript typechecking live in ci.yml.
# - Rust formatting and clippy live in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository and run local
# checks. No secrets are used anywhere in this workflow, so
# pull_request runs from forks are safe.
permissions:
  contents: read

# One run per ref at a time: a new push to a PR cancels the stale run,
# but runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The private-key script calls `cargo tree`, so Rust is needed
      # even though this job compiles nothing.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check trailing whitespace in Markdown
        run: |
          if find . -name '*.md' -not -path './node_modules/*' -print0 \
            | xargs -0 grep -n ' $'; then
            echo "Trailing whitespace found in Markdown files."
            exit 1
          fi

      - name: Check workflow YAML parses
        run: |
          python3 -c "
          import glob, sys, yaml
          for f in sorted(glob.glob('.github/**/*.yml', recursive=True)):
              yaml.safe_load(open(f))
          print('All .github YAML files parse.')
          "

      - name: Check no private key in the desktop app
        run: bash scripts/check-no-private-key.sh
