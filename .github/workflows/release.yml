name: Release

# Pushing a git tag that starts with "v" (for example v0.1.0) runs this
# workflow — it builds the Windows app and creates a GitHub Release
# (draft) with the installer, the updater artifacts (latest.json) and
# the portable ZIP attached.
#
# How to trigger it:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Windows only: this app targets Windows (bundle targets: ["nsis"] in
# src-tauri/tauri.conf.json), so the workflow ships a Windows installer
# and a portable ZIP only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Required to create the release and upload assets, otherwise
# tauri-action fails with a permission error such as
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install pnpm BEFORE setup-node — setup-node's pnpm cache option
      # (below) looks for an already-available pnpm executable.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # No `version:` input here: package.json already pins the pnpm
        # version via `packageManager`, and pnpm/action-setup v6 errors
        # out when both are set ("Multiple versions of pnpm specified").
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DesktopDashboards ${{ github.ref_name }}"
          releaseBody: |
            ## DesktopDashboards v0.1.0 — first release

            A lightweight Windows desktop gadget app (Tauri 2 + WebView2). Keep any web app, Muse Space, or local HTML file resident on your desktop — pinned to the very back or embedded in the wallpaper layer — instead of in browser tabs.

            ## What's new in v0.1.0 (Phases 1–3)

            - **Phase 1 (MVP)**: CLI (`--add-url`, `--manager`, `--silent`), single-instance protection, atomic `config.json` persistence, pinned-to-bottom mode, navigation control, manager window + tray
            - **Phase 2**: lock, opacity 20–100% + click-through, no-focus-steal, zoom 50–200%, auto-reload with input guard, multi-monitor DPI support
            - **Phase 3**: `WorkerW` wallpaper embedding (survives `Win + D`, auto re-attach after Explorer restart), custom CSS injection per gadget
            - **Session isolation**: dedicated WebView2 profile (`%LOCALAPPDATA%\DesktopDashboards\webview`) — login state shared across gadgets

            ## Download (.exe)

            - **Installer**: `Reponyx-Desktop_0.1.0_x64-setup.exe` (NSIS, per-user install, no admin needed)
            - **Portable ZIP**: `reponyx-desktop-x64.zip` (unzip and run `desktop-dashboards.exe`; README.md included)
            - **Requires**: Windows 10 / 11 (x64)

            ## Notes

            - First release. The auto-updater (`latest.json`) is included, but the update flow has not been tested end to end yet.
            - If Windows SmartScreen warns ("Windows protected your PC"), click **More info** → **Run anyway** (new binary from an individual developer).
          releaseDraft: true
          prerelease: false

      # The portable ZIP is not produced by tauri-action, so it is built
      # here: the built exe plus the README. This repo has no bundled
      # asset files (no src-tauri/assets/), so nothing else goes in.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/desktop-dashboards.exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath desktop-dashboards-x64.zip

      - name: Upload portable ZIP to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} desktop-dashboards-x64.zip --clobber
