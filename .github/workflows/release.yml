name: Release

# Pushing a git tag that starts with "v" (for example v0.1.0) runs this
# workflow — it builds the Windows app, the background agent and the
# Auth Broker, and creates a GitHub Release (draft) with the installer,
# the updater artifacts (latest.json), the portable ZIP (desktop +
# agent + broker in one folder) and the agent/broker ZIPs attached.
#
# The `test` job runs first and gates the release (audit E2): a tag
# must never ship untested code, even if CI was skipped or its run
# is still pending. CI also runs on tags, but this gate lives inside
# the release workflow itself, so the release cannot start without
# it. The test job runs on Windows — the release platform — so the
# desktop crate is compiled for real, not just checked on Linux.
#
# How to trigger it:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Windows only: RepoNyx targets Windows first (bundle targets: "all"
# in apps/desktop/src-tauri/tauri.conf.json; the Windows bundles are
# NSIS + MSI), so the workflow ships a Windows installer and a
# portable ZIP only.
#
# Signing: the updater is configured in tauri.conf.json (endpoint
# https://github.com/muhammaddomains/reponyx/releases/latest/download/latest.json
# with a minisign public key), so releases must be signed. Set these
# repo secrets (Settings -> Secrets and variables -> Actions) BEFORE
# the first release, otherwise the build fails at signing:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"

# Required to create the release and upload assets, otherwise
# tauri-action fails with a permission error such as
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # The release gate (audit E2): the full Rust suite, the frontend
  # suite, and the desktop crate compile, on the release platform.
  # The `release` job does not start unless this passes.
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop build
        run: pnpm --filter @reponyx/desktop build

      # The desktop crate references the agent and broker binaries
      # (bundle.resources), and tauri-build validates those paths
      # even during `cargo check` — same as CI's windows-build job.
      - name: Build agent and broker (release)
        run: cargo build --release -p reponyx-background-agent -p reponyx-auth-broker

      - name: Check desktop crate
        run: cargo check -p reponyx-desktop

      - name: Rust tests
        run: cargo test --workspace --exclude reponyx-desktop

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Frontend tests
        run: pnpm --filter @reponyx/desktop test

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install pnpm BEFORE setup-node — setup-node's pnpm cache option
      # (below) looks for an already-available pnpm executable.
      # No `version:` input here: package.json already pins the pnpm
      # version via `packageManager` (pnpm@12.21.0), and pnpm/action-setup
      # reads it (setting both errors out with "Multiple versions of
      # pnpm specified").
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The installer bundles the agent and the broker (bundle.resources
      # in apps/desktop/src-tauri/tauri.conf.json), so they must be
      # built in release mode BEFORE tauri-action runs — otherwise the
      # installer ships a desktop that cannot sync. They also ship in
      # the portable ZIP and as their own assets below.
      - name: Build agent and broker binaries
        run: cargo build --release -p reponyx-background-agent -p reponyx-auth-broker

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri project lives in apps/desktop, not the repo root.
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "RepoNyx ${{ github.ref_name }}"
          releaseBody: |
            ## RepoNyx ${{ github.ref_name }}

            Your Repositories. One Local Universe — a Windows-first desktop app (Tauri 2 + React + Rust) that synchronizes GitHub repositories to your machine as local Git mirror archives and working clones, with a background agent and a persistent scheduler.

            See [CHANGELOG.md](https://github.com/muhammaddomains/reponyx/blob/main/CHANGELOG.md) for what changed in this release.

            ## Download

            - **Installer**: `RepoNyx_${{ github.ref_name }}_x64-setup.exe` (NSIS, per-user install, no admin needed)
            - **Portable ZIP**: `reponyx-desktop-x64.zip` (unzip and run `reponyx-desktop.exe`; README.md included — the agent and broker binaries are inside the same folder)
            - **Agent**: `reponyx-agent-x64.zip` (`reponyx-agent.exe` — the background agent; included in the installer and the portable ZIP, and the desktop starts it automatically)
            - **Auth Broker**: `reponyx-auth-broker-x64.zip` (`reponyx-auth-broker.exe` — mints GitHub App tokens; included in the installer and the portable ZIP, and the desktop starts it automatically)
            - **Requires**: Windows 10 / 11 (x64)

            ## Notes

            - The auto-updater artifacts (`latest.json`) are included, and the app can check for updates from Settings → Advanced → Updates. The end-to-end update flow (install v0.1.0 → publish a newer release → update in place) has not been proven on a real machine yet — see `docs/qa/updater-e2e.md` for the procedure; until it passes, treat the updater as wired, not proven.
            - If Windows SmartScreen warns ("Windows protected your PC"), click **More info** → **Run anyway** (new binary from an individual developer).
          releaseDraft: true
          prerelease: false

      # The portable ZIP is not produced by tauri-action, so it is built
      # here: the built exe plus the README. This repo has no bundled
      # asset files (no src-tauri/assets/), so nothing else goes in.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/reponyx-desktop.exe portable/
          Copy-Item target/release/reponyx-agent.exe portable/
          Copy-Item target/release/reponyx-auth-broker.exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath reponyx-desktop-x64.zip
          Compress-Archive -Path target/release/reponyx-agent.exe -DestinationPath reponyx-agent-x64.zip
          Compress-Archive -Path target/release/reponyx-auth-broker.exe -DestinationPath reponyx-auth-broker-x64.zip

      - name: Upload portable ZIP to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} reponyx-desktop-x64.zip reponyx-agent-x64.zip reponyx-auth-broker-x64.zip --clobber
