[workspace]
resolver = "2"
members = [
    "apps/auth-broker",
    "apps/background-agent",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/credential-store",
    "crates/logging",
    "crates/git-engine",
    "crates/provider-abstractions",
    "crates/github-provider",
    "crates/database",
    "crates/scheduler",
    "crates/sync-queue",
    "crates/ipc",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
reponyx-core = { path = "crates/core" }
reponyx-credential-store = { path = "crates/credential-store" }
reponyx-logging = { path = "crates/logging" }
reponyx-git-engine = { path = "crates/git-engine" }
reponyx-provider-abstractions = { path = "crates/provider-abstractions" }
reponyx-github-provider = { path = "crates/github-provider" }
reponyx-database = { path = "crates/database" }
reponyx-scheduler = { path = "crates/scheduler" }
reponyx-sync-queue = { path = "crates/sync-queue" }
reponyx-ipc = { path = "crates/ipc" }

async-trait = "0.1"
axum = { version = "0.8", features = ["json", "query", "http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
