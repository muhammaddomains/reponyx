[package]
name = "reponyx-git-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe Git CLI execution engine: detection, command builders, mirror clone/fetch, locks"

[dependencies]
reponyx-core.workspace = true
reponyx-logging.workspace = true
fs2 = "0.4"
serde.workspace = true
sha2.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
